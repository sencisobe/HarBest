services:
  backend:
    build: ./backend/harbest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/harbest
      SPRING_DATASOURCE_USERNAME: harbest_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: